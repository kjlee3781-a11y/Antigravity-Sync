<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 모음</title>
<style>
  :root{--bg:#14213A;--deep:#0C172B;--card:#22365E;--text:#E8EDF5;--mut:#9FB0CC;--teal:#2DD4BF;--gold:#F4C95D;--line:rgba(255,255,255,.11)}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--deep),var(--bg) 240px);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.6}
  .wrap{max-width:960px;margin:auto;padding:40px 20px 64px}
  h1{margin:0 0 6px;font-size:2rem}
  .sub{color:var(--mut);margin:0 0 28px}
  h2{font-size:.85rem;letter-spacing:.12em;color:var(--teal);margin:32px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
         border-radius:16px;padding:18px}
  a.card:hover{border-color:rgba(45,212,191,.5)}
  .card b{display:block;font-size:1.05rem;margin-bottom:4px}
  .card span{color:var(--mut);font-size:.88rem}
  .tag{display:inline-block;margin-top:10px;font-size:.72rem;color:var(--gold);border:1px solid rgba(244,201,93,.35);
       border-radius:999px;padding:2px 9px}
  .note{color:var(--mut);font-size:.85rem;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>프로그램 모음</h1>
  <p class="sub">카드를 누르면 해당 프로그램이 열립니다. 프로그램마다 폴더가 따로 있어 서로 섞이지 않습니다.</p>

  <h2>경제 · 시장</h2>
  <div class="grid">
    <a class="card" href="economy-dashboard/">
      <b>경제·시장 관제시스템</b>
      <span>한국·미국·글로벌 지표 점검, 지표 사전, 관계 카드, 파생시장 관제실</span><br>
      <span class="tag">Phase 2 · v0.8</span>
    </a>
  </div>

  <p class="note">새 프로그램을 추가하면 이 목록에 카드가 하나씩 늘어납니다.</p>
</div>
</body>
</html>
