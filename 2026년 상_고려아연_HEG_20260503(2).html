<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><title>현대중공업 유해인자 조회 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f1f5f9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-shrink:0}
header h1{font-size:1.1rem;font-weight:800}
header p{font-size:.73rem;opacity:.7}
.hbadge{background:#3b82f6;padding:.2rem .7rem;border-radius:999px;font-size:.7rem;font-weight:700;margin-left:auto;white-space:nowrap}
.layout{display:flex;flex:1;overflow:hidden}
.sb{width:310px;background:#1e293b;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-top{padding:.55rem;border-bottom:1px solid #334155;display:flex;gap:.4rem}
.sb-top input{flex:1;padding:.38rem .65rem;background:#0f172a;border:1px solid #334155;border-radius:.375rem;color:#e2e8f0;font-size:.76rem;font-family:inherit}
.sb-top button{padding:.38rem .6rem;background:#1e40af;border:none;border-radius:.375rem;color:#fff;font-size:.7rem;cursor:pointer;white-space:nowrap}
.sb-body{flex:1;overflow-y:auto}
.d-hd{display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;cursor:pointer;color:#94a3b8;font-size:.77rem;font-weight:700;border-bottom:1px solid #0f172a}
.d-hd:hover{background:#334155;color:#e2e8f0}
.s-row{display:flex;align-items:center;gap:.35rem;padding:.4rem .75rem .4rem 1.4rem;cursor:pointer;color:#64748b;font-size:.74rem;border-left:2px solid #334155}
.s-row:hover{color:#93c5fd;background:#0f172a}
.c-wrap{padding:.25rem .5rem .3rem 1.75rem;background:#0f172a}
.c-row{display:flex;align-items:center;gap:.3rem;padding:.3rem .45rem;border-radius:.35rem}
.c-row:hover{background:#1e293b}
.c-name{font-size:.72rem;font-weight:600;color:#94a3b8;cursor:pointer;flex:1;display:flex;align-items:center;gap:.3rem}
.j-wrap{padding:.15rem .25rem .25rem 1rem}
.j-chip{display:flex;align-items:center;gap:.3rem;padding:.28rem .45rem;border-radius:.35rem;cursor:pointer;font-size:.71rem;color:#64748b;margin-bottom:.12rem;border-left:2px solid transparent}
.j-chip:hover{color:#93c5fd;background:#1e3a5f}
.j-chip.sel{color:#60a5fa;border-left-color:#3b82f6;background:#1e3a5f;font-weight:700}
.j-chip span{flex:1}
.bx{background:none;border:none;cursor:pointer;color:#ef4444;font-size:.68rem;padding:.1rem .2rem;border-radius:.2rem;opacity:.5;flex-shrink:0}
.bx:hover{opacity:1;background:rgba(239,68,68,.15)}
.badd{display:flex;align-items:center;gap:.3rem;width:100%;padding:.28rem .45rem;background:none;border:1px dashed;border-radius:.35rem;font-family:inherit;font-size:.7rem;cursor:pointer;margin-top:.2rem;transition:all .15s}
.badd.job{border-color:#334155;color:#475569}
.badd.job:hover{border-color:#3b82f6;color:#60a5fa}
.badd.con{border-color:#1e3a5f;color:#334155;margin:.3rem 0 .1rem}
.badd.con:hover{border-color:#60a5fa;color:#93c5fd}
.panel{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:.5rem}
.empty div{font-size:2.5rem}
.pcard{background:#fff;border-radius:.75rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.phdr{padding:1.1rem 1.25rem;color:#fff;border-radius:.75rem .75rem 0 0}
.phdr h2{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
.phdr .meta{font-size:.78rem;opacity:.8;margin-top:.3rem}
.pinner{padding:1.1rem}
.pinner h3{font-size:.86rem;font-weight:700;color:#1e293b;margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.pinner h3::before{content:'';width:3px;height:1em;background:#3b82f6;border-radius:2px}
textarea{width:100%;min-height:108px;padding:.68rem;border:1.5px solid #e2e8f0;border-radius:.5rem;font-family:inherit;font-size:.83rem;resize:vertical;background:#f8fafc;line-height:1.72}
textarea:focus{outline:none;border-color:#3b82f6;background:#fff}
.hint{font-size:.72rem;color:#64748b;margin-top:.32rem;line-height:1.5}
.tbtns{display:flex;gap:.55rem;margin-top:.75rem;flex-wrap:wrap}
.tb{padding:.52rem .95rem;border:none;border-radius:.45rem;font-family:inherit;font-size:.79rem;font-weight:700;cursor:pointer;transition:all .16s;display:flex;align-items:center;gap:.32rem}
.tb:hover{transform:translateY(-1px);opacity:.9}
.tb.bei{background:linear-gradient(135deg,#065f46,#059669);color:#fff}
.tb.exam{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff}
.tb.organ{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}
.tb.clr{background:#fff;color:#ef4444;border:1.5px solid #fca5a5}
.tb.sav{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.tabs{display:flex;border-bottom:2px solid #f1f5f9}
.tab{padding:.58rem 1rem;font-size:.77rem;font-weight:700;cursor:pointer;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.on{color:#1e40af;border-bottom-color:#3b82f6}
.rbody{padding:.85rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead tr{background:linear-gradient(135deg,#1e293b,#334155);color:#fff}
th{padding:.58rem .8rem;text-align:left;font-weight:600;white-space:nowrap}
td{padding:.52rem .8rem;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.6}
tbody tr:hover{background:#f8fafc}
.cn{font-weight:700;color:#1e40af}
.ci{color:#374151}
.cs{color:#64748b}
.bc{display:inline-block;background:#dbeafe;color:#1e40af;padding:.1rem .48rem;border-radius:999px;font-size:.72rem;font-weight:700}
.unm{margin-top:.55rem;padding:.6rem .8rem;background:#fef9c3;border:1px solid #fde68a;border-radius:.45rem;font-size:.77rem;color:#78350f}
.unm b{color:#92400e;display:block;margin-bottom:.22rem}
.hctag{display:inline-block;background:#dbeafe;color:#1e40af;padding:.06rem .38rem;border-radius:999px;font-size:.67rem;font-weight:700;margin-left:.3rem}
/* === Drag & Drop styles === */
.s-row,.c-row,.j-chip{cursor:grab}
.s-row:active,.c-row:active,.j-chip:active{cursor:grabbing}
.sortable-ghost{opacity:.35;background:#1e3a5f !important;border:1.5px dashed #60a5fa !important}
.sortable-chosen{background:#1e3a5f !important}
.sortable-drag{opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.sub-block,.contractor-block{position:relative}
.drop-hint{display:none;font-size:.66rem;color:#60a5fa;padding:.15rem .5rem .25rem;font-style:italic;opacity:.75}
.s-container.drop-active .drop-hint,.c-wrap.drop-active .drop-hint,.j-wrap.drop-active .drop-hint{display:block}
.dnd-toast{position:fixed;bottom:1.5rem;left:50%;transform:translate(-50%,12px);padding:.5rem 1rem;background:rgba(15,23,42,.92);color:#fff;font-size:.78rem;font-weight:600;border-radius:.45rem;z-index:9999;opacity:0;transition:all .25s;pointer-events:none}
.dnd-toast.show{opacity:1;transform:translate(-50%,0)}

/* === Modal Styles === */
.modal-ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(4px)}
.modal{background:#fff;width:90%;max-width:650px;border-radius:1rem;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);display:flex;flex-direction:column;max-height:85vh;animation:modalShow 0.3s ease-out}
@keyframes modalShow{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.m-hd{padding:1.25rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
.m-hd h2{font-size:1.1rem;font-weight:800;color:#0f172a}
.m-bd{padding:1.5rem;overflow-y:auto;flex:1}
.m-ft{padding:1.1rem 1.5rem;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:.75rem;background:#f8fafc;border-radius:0 0 1rem 1rem}
.m-btn{padding:.6rem 1.2rem;border-radius:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;transition:all 0.15s;border:none}
.m-btn.sec{background:#e2e8f0;color:#475569}
.m-btn.pri{background:#4f46e5;color:#fff}
.m-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.m-lbl{display:block;font-size:.82rem;font-weight:700;color:#475569;margin-bottom:.5rem}
.m-sel{width:100%;padding:.5rem;border:1.5px solid #e2e8f0;border-radius:.4rem;margin-bottom:1rem;font-family:inherit;font-size:.85rem}
/* === 패널 툴바 (항상 고정) === */
.panel-toolbar{flex-shrink:0;display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;background:#1e293b;border-bottom:1px solid #334155}
.panel-toolbar .ptb-btn{padding:.32rem .8rem;border:none;border-radius:.375rem;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;color:#fff;transition:filter .15s;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
.panel-toolbar .ptb-btn:hover{filter:brightness(1.15)}
.panel-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.panel-wrap > .panel{flex:1;overflow-y:auto}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hdrTitle">🚢 <span id="hdrCompany">현대중공업</span> 유해인자 조회 시스템 <button onclick="renameCompany()" title="회사명 수정" style="background:rgba(255,255,255,.18);border:none;border-radius:.3rem;color:#fff;font-size:.65rem;font-weight:600;padding:.18rem .5rem;cursor:pointer;font-family:inherit;margin-left:.4rem;vertical-align:middle">✏ 회사명</button></h1>
    <p>부서 → 협력업체 → 직종 선택 후 유해인자 입력 및 분류</p>
  </div>
  <button onclick="saveAsNew()" style="padding:.32rem .8rem;background:#065f46;border:none;border-radius:.375rem;color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">📤 다른이름으로 저장</button><span class="hbadge" id="hdrBadge">HD Hyundai Heavy Industries</span>
</header>
<div class="layout">
  <div class="sb">
    <div class="sb-top">
      <input id="q" placeholder="🔍 검색..." oninput="rSB()">
      <button onclick="resetState()">초기화</button>
    </div>
    <div class="sb-body" id="sbBody"></div>
  </div>
  <div class="panel-wrap">
    <div class="panel-toolbar">
      <button class="ptb-btn" onclick="openImportHC()" style="background:#4f46e5">📥 인원 일괄 업데이트</button>
      <button class="ptb-btn" onclick="generatePivotTable()" style="background:#2563eb">📊 부서별 인원표 작성</button>
    </div>
    <div class="panel" id="panel">
    <div class="empty"><div>⬅️</div><p>왼쪽에서 직종을 선택하세요</p></div>
</div></div>
  </div>
</div>
<script>

function _newId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function uniqueName(name,existing){
  if(!existing.includes(name))return name;
  const m=name.match(/^(.+?)\s*\((\d+)\)$/);
  const stem=(m?m[1]:name).trim();
  let i=2;
  while(existing.includes(`${stem}(${i})`))i++;
  return `${stem}(${i})`;
}
function findSubIndex(dId,sId){
  const d=gd(dId);if(!d)return -1;
  return (d.subs||[]).findIndex(s=>s.id===sId);
}
function findJobPath(jId){
  for(const d of S.org){
    for(let si=0;si<(d.subs||[]).length;si++){
      const s=d.subs[si];
      for(const c of (s.contractors||[])){
        for(const j of (c.jobs||[])){
          if(j.id===jId)return {dId:d.id,si,cId:c.id,jId};
        }
      }
    }
  }
  return null;
}
function syncSelAfterMove(){
  if(!S.sel||!S.sel.jId)return;
  const p=findJobPath(S.sel.jId);
  if(p)S.sel=p;
  else S.sel=null;
}

let _sortables=[];
function destroySortables(){
  // IMPORTANT: must run BEFORE innerHTML replacement, while DOM is still alive.
  // Otherwise SortableJS's destroy() corrupts its global sortables[] array via
  // splice(indexOf(this.el)=-1, 1) which removes a wrong element.
  if(typeof Sortable==='undefined'){_sortables=[];return;}
  _sortables.forEach(s=>{try{s.destroy();}catch(e){}});
  _sortables=[];
}
function initDragAndDrop(){
  if(typeof Sortable==='undefined')return;

  // Jobs (직종) - all .j-wrap containers share group 'jobs'
  document.querySelectorAll('[data-jobs-container]').forEach(el=>{
    _sortables.push(new Sortable(el,{
      group:'jobs',
      animation:160,

    }));
  });

  // Contractors (협력업체) - all .c-wrap containers share group 'contractors'
  document.querySelectorAll('[data-contractors-container]').forEach(el=>{

function handleJobDrop(evt){
  document.querySelectorAll('.drop-active').forEach(el=>el.classList.remove('drop-active'));
  const fromEl=evt.from, toEl=evt.to, item=evt.item;
  const jId=item.dataset.jid;
  const srcDId=fromEl.dataset.d, srcSId=fromEl.dataset.sid, srcCId=fromEl.dataset.cid;
  const destDId=toEl.dataset.d, destSId=toEl.dataset.sid, destCId=toEl.dataset.cid;
  if(!srcDId||!destDId){setTimeout(rSB,0);return;}
  const srcSi=findSubIndex(srcDId,srcSId);
  const destSi=findSubIndex(destDId,destSId);
  if(srcSi<0||destSi<0){setTimeout(rSB,0);return;}
  const srcC=gc(srcDId,srcSi,srcCId);
  const destC=gc(destDId,destSi,destCId);
  if(!srcC||!destC){setTimeout(rSB,0);return;}
  const jobIdx=(srcC.jobs||[]).findIndex(j=>j.id===jId);
  if(jobIdx<0){setTimeout(rSB,0);return;}
  // Determine new position from DOM order in destination
  const newOrderIds=[...toEl.querySelectorAll(':scope > .j-chip[data-jid]')].map(el=>el.dataset.jid);
  const newPos=newOrderIds.indexOf(jId);
  // Remove from source
  const [job]=srcC.jobs.splice(jobIdx,1);
  // If cross-contractor, handle name conflicts
  let renamed=false;
  if(srcC!==destC){
    const existingNames=destC.jobs.map(j=>j.name);
    const newName=uniqueName(job.name,existingNames);
    if(newName!==job.name){renamed=true;job.name=newName;}
  }
  // Insert at new position
  const ip=newPos<0?destC.jobs.length:newPos;
  destC.jobs.splice(ip,0,job);
  // Update sel if needed
  if(S.sel?.jId===jId)S.sel={dId:destDId,si:destSi,cId:destCId,jId};
  syncSelAfterMove();
  save();setTimeout(rSB,0);
  if(renamed)dndToast(`이름 충돌 → '${job.name}'(으)로 변경됨`);
  else if(srcC!==destC)dndToast('직종 이동 완료');
}

function handleContractorDrop(evt){
  document.querySelectorAll('.drop-active').forEach(el=>el.classList.remove('drop-active'));
  const fromEl=evt.from, toEl=evt.to, item=evt.item;
  const cId=item.dataset.cid;
  const srcDId=fromEl.dataset.d, srcSId=fromEl.dataset.sid;
  const destDId=toEl.dataset.d, destSId=toEl.dataset.sid;
  if(!srcDId||!destDId){setTimeout(rSB,0);return;}
  const srcSi=findSubIndex(srcDId,srcSId);
  const destSi=findSubIndex(destDId,destSId);
  if(srcSi<0||destSi<0){setTimeout(rSB,0);return;}
  const srcS=gs(srcDId,srcSi);
  const destS=gs(destDId,destSi);
  if(!srcS||!destS){setTimeout(rSB,0);return;}
  if(!srcS.contractors)srcS.contractors=[];
  if(!destS.contractors)destS.contractors=[];
  const cIdx=srcS.contractors.findIndex(c=>c.id===cId);
  if(cIdx<0){setTimeout(rSB,0);return;}
  // Remove first
  const [contractor]=srcS.contractors.splice(cIdx,1);
  // Determine new position from DOM order (DOM already reflects the move post-onEnd)
  const newOrderIds=[...toEl.querySelectorAll(':scope > .contractor-block[data-cid]')].map(el=>el.dataset.cid);
  let newPos=newOrderIds.indexOf(cId);
  if(newPos<0)newPos=destS.contractors.length;
  // If cross-parent: handle name & ID conflicts
  let renamed=false, idChanged=false;
  if(srcS!==destS){
    const existingNames=destS.contractors.map(c=>c.name);
    const newName=uniqueName(contractor.name,existingNames);
    if(newName!==contractor.name){renamed=true;contractor.name=newName;}
    // ID conflict: if any contractor in destS shares this id, give the moved one a new id
    if(destS.contractors.some(c=>c.id===contractor.id)){
      contractor.id=_newId('c');
      idChanged=true;
    }
  }
  // Insert
  destS.contractors.splice(newPos,0,contractor);
  // Update sel if pointing to the moved contractor
  if(S.sel?.cId===cId&&S.sel?.dId===srcDId&&S.sel?.si===srcSi){
    S.sel={...S.sel,dId:destDId,si:destSi,cId:contractor.id};
  }
  syncSelAfterMove();
  save();setTimeout(rSB,0);
  if(renamed)dndToast(`이름 충돌 → '${contractor.name}'(으)로 변경됨`);
  else if(srcS!==destS)dndToast('협력업체 이동 완료');
}

function handleSubDrop(evt){
  document.querySelectorAll('.drop-active').forEach(el=>el.classList.remove('drop-active'));
  const fromEl=evt.from, toEl=evt.to, item=evt.item;
  const sId=item.dataset.sid;
  const srcDId=fromEl.dataset.d;
  const destDId=toEl.dataset.d;
  if(!srcDId||!destDId){setTimeout(rSB,0);return;}
  const srcD=gd(srcDId);
  const destD=gd(destDId);
  if(!srcD||!destD){setTimeout(rSB,0);return;}
  if(!srcD.subs)srcD.subs=[];
  if(!destD.subs)destD.subs=[];
  const sIdx=srcD.subs.findIndex(s=>s.id===sId);
  if(sIdx<0){setTimeout(rSB,0);return;}
  const [sub]=srcD.subs.splice(sIdx,1);
  const newOrderIds=[...toEl.querySelectorAll(':scope > .sub-block[data-sid]')].map(el=>el.dataset.sid);
  let newPos=newOrderIds.indexOf(sId);
  if(newPos<0)newPos=destD.subs.length;
  let renamed=false;
  if(srcD!==destD){
    const existingNames=destD.subs.map(s=>s.name);
    const newName=uniqueName(sub.name,existingNames);
    if(newName!==sub.name){renamed=true;sub.name=newName;}
  }
  destD.subs.splice(newPos,0,sub);
  syncSelAfterMove();
  // exp 키도 si 기반이라 부분적으로 stale해질 수 있으나, S.exp는 boolean dict라 영향 적음
  save();setTimeout(rSB,0);
  if(renamed)dndToast(`이름 충돌 → '${sub.name}'(으)로 변경됨`);
  else if(srcD!==destD)dndToast('부서 이동 완료');
}

// ── Norm/parse ────────────────────────────────────────────────
const normS=s=>s.replace(/\((유기|금속|산|가스|허가|분진|물리|가공유|야간)-[^)]+\)/g,'').replace(/\s/g,'').toLowerCase();
const normI=s=>s.replace(/\((유기|금속|산|가스|허가|분진|물리|가공유|야간)-[^)]+\)/gi,'').replace(/\(.*?\)/g,'').replace(/\s/g,'').toLowerCase().trim();
function parseInput(t){
    t=t.replace(/니켈\s*및\s*그\s*무기화합물\s*,\s*니켈\s*카르보닐/g, '니켈 및 그 무기화합물‡ 니켈 카르보닐');
    t=t.replace(/광물성오일\s*,\s*Oilmist/gi, '광물성오일‡ Oilmist');
    t=t.replace(/([0-9A-Za-z'])\s*,\s*(?=[0-9A-Za-z'])/g, '$1‡');
    
    const p=[];let b='',d=0;
    for(const c of t){if(c==='('||c==='['||c==='{')d++;else if(c===')'||c===']'||c==='}')d--;if(c==='\n'||(c===','&&d===0)){if(b.trim())p.push(b.trim());b='';}else b+=c;}
    if(b.trim())p.push(b.trim());return p.map(x=>x.replace(/‡/g, ',')).filter(Boolean);
  }

// ── Indexes ───────────────────────────────────────────────────
const BEI_IDX={},EXAM_IDX={},ORGAN_IDX={};
BEI_DB.forEach((r,i)=>{const k=normS(r[0]);if(!(k in BEI_IDX))BEI_IDX[k]=i;});
BEI_IDX['메틸클로로포름']=BEI_IDX['1,1,1-트리클로로에탄']=BEI_DB.findIndex(r=>normS(r[0]).includes('메틸클로로포름'));
BEI_IDX['헥산']=BEI_IDX['n헥산']=BEI_DB.findIndex(r=>normS(r[0]).includes('헥산'));
Object.entries(EXAM_DB).forEach(([exam,items])=>items.forEach(n=>{if(!EXAM_IDX[n])EXAM_IDX[n]=[];if(!EXAM_IDX[n].includes(exam))EXAM_IDX[n].push(exam);}));
ORGAN_DB.forEach(e=>e.i.forEach(n=>{if(!ORGAN_IDX[n])ORGAN_IDX[n]=[];ORGAN_IDX[n].push({o:e.o,c:e.c});}));

function findKey(n,idx){
  if(n in idx)return n;
  const nR=n.replace(/\(.*?\)/g,'');
  if(nR!==n&&nR in idx)return nR;
  for(const k of Object.keys(idx)){if(k.length>2&&(n.includes(k)||k.includes(n)))return k;}
  return null;
}

function classify(tab){
  const el=document.getElementById('haz');
  if(!el||!el.value.trim()){alert('유해인자를 입력하세요.');return;}
  // 새 입력값으로 교체 저장
  if(S.sel){const{dId,si,cId,jId}=S.sel;const jj=gj(dId,si,cId,jId);if(jj){jj.hazards=el.value;save();}}
  const inputs=parseInput(el.value);
  const bM=[],bU=[],bSeen=new Set();
  const eR={},eU=[];
  const oR={},oU=[];
  inputs.forEach(raw=>{
    const n=normI(raw);
    // BEI
    const bk=findKey(n,BEI_IDX);
    if(bk!=null&&BEI_IDX[bk]>=0){const i=BEI_IDX[bk];if(!bSeen.has(i)){bSeen.add(i);bM.push(BEI_DB[i]);}}
    else if(bk==null) bU.push(raw);
    // EXAM
    const ek=findKey(n,EXAM_IDX);
    if(ek){EXAM_IDX[ek].forEach(exam=>{if(!eR[exam])eR[exam]=new Set();eR[exam].add(raw);});}
    else eU.push(raw);
    // ORGAN
    const ok=findKey(n,ORGAN_IDX);
    if(ok){ORGAN_IDX[ok].forEach(({o,c})=>{if(!oR[o])oR[o]={};if(!oR[o][c])oR[o][c]=new Set();oR[o][c].add(raw);});}
    else oU.push(raw);
  });
  lastR={bei:{m:bM,u:bU},exam:{r:eR,u:eU},organ:{r:oR,u:oU}};
  activeTab=tab;
  document.getElementById('resCard').style.display='block';
  showTab(tab);
  document.getElementById('resCard').scrollIntoView({behavior:'smooth',block:'nearest'});
}

    const{r,u}=lastR.organ||{r:{},u:[]};
    if(!Object.keys(r).length){rb.innerHTML=`<p style="color:#94a3b8;text-align:center;padding:1rem">해당 표적장기 없음</p>${u.length?`<div class="unm"><b>미매칭</b>${esc(u.join(', '))}</div>`:''}`;return;}
    let h=`<table><thead><tr><th>표적장기</th><th>분류</th><th>유해인자</th><th>개수</th></tr></thead><tbody>`;
    [...ORGAN_ORD.filter(o=>r[o]),...Object.keys(r).filter(o=>!ORGAN_ORD.includes(o))].forEach(o=>{
      Object.keys(r[o]).forEach(c=>{
        const items=[...r[o][c]];
        h+=`<tr><td class="cn">${esc(o)}</td><td class="cs">${esc(c)}</td><td class="ci">${items.map(esc).join(', ')}</td><td style="text-align:center"><span class="bc">${items.length}</span></td></tr>`;
      });
    });
    h+=`</tbody></table>`;
    if(u.length)h+=`<div class="unm"><b>⚠ 미매칭</b>${esc(u.join(', '))}</div>`;
    rb.innerHTML=h;
  }
}

function copyResult(){
  const rb=document.getElementById('rbody');if(!rb)return;
  const table=rb.querySelector('table');
  if(!table){showToast('독사할 결과가 없습니다.',true);return;}
  let tsv='';
  table.querySelectorAll('tr').forEach(r=>{
    tsv+=[...r.querySelectorAll('td,th')].map(c=>c.innerText.trim()).join('\t')+'\n';
  });
  if(navigator.clipboard){
    navigator.clipboard.writeText(tsv)
      .then(()=>showToast('클립보드에 복사되었습니다. 엑셀에 붙여넣기 하세요.'))
      .catch(()=>legacyCopy(tsv));
  } else legacyCopy(tsv);
}
function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('복사되었습니다.');}
  catch(e){showToast('복사 실패. 수동으로 선택하세요.',true);}
  document.body.removeChild(ta);
}
function dlResult(){
  const rb=document.getElementById('rbody');if(!rb)return;
  const table=rb.querySelector('table');
  if(!table){showToast('다운로드할 결과가 없습니다.',true);return;}
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const tabName=activeTab==='bei'?'BEI생물학적노옶지표':activeTab==='exam'?'검사항목별분류':activeTab==='pivot'?'부서별인원표':'표적장기별분류';
  const sel=S.sel;const j=sel?gj(sel.dId,sel.si,sel.cId,sel.jId):null;
  const prefix=j?j.name+'_':'';
  const fn=`${prefix}${tabName}_${ds}.csv`;
  let csv='\uFEFF';
  table.querySelectorAll('tr').forEach(r=>{
    const line=[...r.querySelectorAll('td,th')].map(c=>{
      let v=c.innerText.trim().replace(/"/g,'""');
      if(v.includes(',')||v.includes('\n'))v=`"${v}"`;
      return v;
    }).join(',');
    csv+=line+'\r\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast(`'${fn}' 다운로드 완료`);
}
function showToast(msg,err=false){
  let t=document.getElementById('_toast');
  if(!t){
    t=document.createElement('div');t.id='_toast';
    t.style.cssText='position:fixed;bottom:1.5rem;right:1.5rem;padding:.65rem 1.2rem;border-radius:.5rem;color:#fff;font-size:.82rem;font-weight:600;z-index:9999;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;font-family:Noto Sans KR,sans-serif';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.background=err?'#dc2626':'#065f46';
  t.style.opacity='1';t.style.transform='translateY(0)';
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(12px)';},3000);
}

function b64dec(s){try{return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}catch(e){return null;}}
// ── IndexedDB dir handle helpers ─────────────────────────────────
function _idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('haz_fs',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('h');r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function _idbGet(k){try{const db=await _idbOpen();return new Promise((res,rej)=>{const r=db.transaction('h').objectStore('h').get(k);r.onsuccess=()=>res(r.result);r.onerror=rej;});}catch(e){return null;}}
async function _idbSet(k,v){try{const db=await _idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('h','readwrite');tx.objectStore('h').put(v,k);tx.oncomplete=res;tx.onerror=rej;});}catch(e){}}

async function saveAsNew(){
    const suggested = '현대중공업_유해인자_조회시스템.html';
    const state=JSON.stringify(S);
    if(!APP_TPL_B64 || APP_TPL_B64==='__TEMPLATE_B64__'){showToast('템플릿을 찾을 수 없습니다.',true);return;}
    const tpl=b64dec(APP_TPL_B64);
    if(!tpl){showToast('템플릿 디코딩 실패',true);return;}
    
    // Create robust replacements using regex so it works even after multiple generations
    let out = tpl.replace(/const APP_TPL_B64\s*=\s*["'`][\s\S]*?["'`];/, 'const APP_TPL_B64="' + APP_TPL_B64 + '";');
    out = out.replace(/const INIT_STATE\s*=\s*[\s\S]*?;/, 'const INIT_STATE=' + state + ';');
    
    const blob=new Blob([out],{type:'text/html;charset=utf-8'});

    if(window.showSaveFilePicker){
      try{
        const fh=await showSaveFilePicker({
          id: 'haz_fs',
          suggestedName: suggested,
          types: [{description: 'HTML 파일', accept: {'text/html': ['.html']}}]
        });
        const w=await fh.createWritable();
        await w.write(blob);
        await w.close();
        showToast('정상적으로 저장되었습니다.');
        return;
      }catch(e){
        if(e.name==='AbortError')return;
        console.warn('save picker failed', e);
      }
    }
    
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=suggested;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('다운로드 폴더에 자동저장 되었습니다.');
    setTimeout(()=>URL.revokeObjectURL(a.href),1e4);
  }

// ── 인원 일괄 업데이트 (Auto Reverse Tree Builder) ─────────────
function openImportHC(){document.getElementById('modalHC').style.display='flex';document.getElementById('hcImportText').value='';}
function closeImportHC(){document.getElementById('modalHC').style.display='none';}
function applyImportHC(){
  const text=document.getElementById('hcImportText').value.trim();
  if(!text){alert('데이터를 입력해주세요.');return;}
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  let updateMap=new Map();
  const noiseWords=['총계','합계','총합','직종','부서','직종의 counta','0',''];
  lines.forEach(line=>{
    let parts=[],count=1;
    if(line.includes('\t')){
      parts=line.split('\t').map(p=>p.trim()).filter(Boolean);
      if(parts.length>0){const last=parts[parts.length-1];if(parts.length>1&&!isNaN(last)&&/^\d+$/.test(last)){count=parseInt(last);parts.pop();}}
    } else {parts=line.split(/[-/,|]/).map(p=>p.trim()).filter(Boolean);}
    if(!parts.length)return;
    if(noiseWords.includes(parts[parts.length-1].toLowerCase()))return;
    const key=JSON.stringify(parts);
    updateMap.set(key,(updateMap.get(key)||0)+count);
  });
  if(!updateMap.size){alert('유효한 데이터가 없습니다.');return;}
  if(confirm('기존 인원수를 모두 0으로 초기화하고 새로운 데이터로 갱신하시겠습니까?\n(취소 시 기존 인원 및 조직도에 새로 추가/누적됩니다)')){
    S.org.forEach(d=>(d.subs||[]).forEach(s=>(s.contractors||[]).forEach(c=>(c.jobs||[]).forEach(j=>j.headcount=0))));
  }
  let added=0;
  updateMap.forEach((count,pathStr)=>{
    const path=JSON.parse(pathStr);
    let jName=path.pop()||'무명 직종';
    let cName=path.pop()||'기본 협력업체';
    let sName=path.pop()||'기본 부서';
    let dName=path.length>0?path.join('-'):'일괄추가(미분류)';
    let dNode=S.org.find(d=>normI(d.name)===normI(dName));
    if(!dNode){dNode={id:'d'+Date.now()+Math.random(),name:dName,icon:'📁',color:'#1e40af',subs:[]};S.org.push(dNode);}
    let sNode=(dNode.subs||[]).find(s=>normI(s.name)===normI(sName));
    if(!sNode){sNode={name:sName,contractors:[]};dNode.subs.push(sNode);}
    let cNode=(sNode.contractors||[]).find(c=>normI(c.name)===normI(cName));
    if(!cNode){cNode={id:'c'+Date.now()+Math.random(),name:cName,jobs:[]};sNode.contractors.push(cNode);}
    let jNode=(cNode.jobs||[]).find(j=>normI(j.name)===normI(jName));
    if(!jNode){cNode.jobs.push({id:'j'+Date.now()+Math.random(),name:jName,hazards:'',headcount:count});}
    else{jNode.headcount=(jNode.headcount||0)+count;}
    added++;
  });
  if(typeof migrateIds==='function')migrateIds();
  save();
  alert(`총 ${updateMap.size}개 그룹 분석 완료, ${added}개 직종 생성/반영 성공!`);
  closeImportHC();rSB();rPanel();
}
// ── 부서별 인원표 작성 (Pivot Table) ──────────────────────────
function generatePivotTable(){
  const mp=document.getElementById('panel');if(!mp)return;
  activeTab='pivot';
  let grandTotal=0,tableRows='';
  S.org.forEach(d=>{
    (d.subs||[]).forEach(s=>{
      let deptName=d.name===s.name?d.name:d.name+' '+s.name;
      let deptTotal=0,deptRows=[];
      (s.contractors||[]).forEach(c=>{
        let compTotal=0,compRows=[];
        (c.jobs||[]).forEach(j=>{
          let cnt=parseInt(j.headcount)||0;
          if(cnt>0){compRows.push(`<tr><td class="ci" style="border-right:none"></td><td class="cs" style="border-left:none;border-right:none"></td><td class="cn">${esc(j.name)}</td><td style="text-align:right"><span class="bc">${cnt}</span></td></tr>`);compTotal+=cnt;}
        });
        if(compTotal>0){
          deptRows.push(`<tr style="background:#f8fafc"><td style="border-right:none"></td><td class="ci" style="font-weight:bold;border-left:none">${esc(c.name)}</td><td class="cs" style="text-align:center;font-size:.75rem">소계</td><td style="text-align:right;font-weight:bold"><span class="bc" style="background:#bfdbfe;color:#1e3a8a">${compTotal}</span></td></tr>`);
          deptRows=deptRows.concat(compRows);deptTotal+=compTotal;
        }
      });
      if(deptTotal>0){
        tableRows+=`<tr style="background:#eff6ff"><td class="cn" style="font-weight:bold;font-size:.9rem">${esc(deptName)}</td><td class="cs"></td><td class="cs" style="text-align:center;font-size:.8rem">부서 합계</td><td style="text-align:right;font-weight:bold"><span class="bc" style="background:#93c5fd;color:#1e3a8a;font-size:.85rem">${deptTotal}</span></td></tr>`;
        tableRows+=deptRows.join('');grandTotal+=deptTotal;
      }
    });
  });
  let h=`<div class="pcard" id="resCard"><div class="phdr" style="background:linear-gradient(135deg,#1e40af,#1e40afbb)"><h2>📊 부서 및 협력업체별 인원 요약표 (Pivot)</h2></div><div class="pinner"><div style="display:flex;gap:.4rem;padding:.3rem .6rem;justify-content:flex-end"><button onclick="copyResult()" style="padding:.35rem .75rem;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:.375rem;font-family:inherit;font-size:.74rem;font-weight:700;cursor:pointer;color:#334155">📋 복사</button><button onclick="dlResult()" style="padding:.35rem .75rem;background:#1e40af;border:none;border-radius:.375rem;font-family:inherit;font-size:.74rem;font-weight:700;cursor:pointer;color:#fff">⬇ 다운로드</button></div><div class="rbody" id="rbody">`;
  if(!grandTotal){h+=`<p style="color:#94a3b8;text-align:center;padding:1rem">등록된 인원이 없습니다.</p>`;}
  else{h+=`<table><thead><tr><th>부서</th><th>협력업체</th><th>직종</th><th>인원수</th></tr></thead><tbody>${tableRows}<tr style="background:#dbeafe;border-top:2px solid #3b82f6"><td></td><td></td><td class="cn" style="font-weight:bold;text-align:center">총 합계</td><td style="text-align:right;font-weight:bold"><span class="bc" style="background:#3b82f6;color:#fff">${grandTotal}</span></td></tr></tbody></table>`;}
  h+=`</div></div></div>`;
  mp.innerHTML=h;
}
